spring:
  application:
    name: library-api

  datasource:
    url: jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

security:
  jwt:
    secret: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7481f2c7b7e0f7a89ab1c6f67b
    expiration: 86400000  # 24h in ms

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: Library Management API
    version: 1.0.0

logging:
  level:
    com.example.library: DEBUG
    org.springframework.security: INFO
